name: Ministries iOS - Build and Upload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      TEAM_ID: RSMZ9PL42J
      BUNDLE_ID: com.samidengeli.ministries
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the iOS project (Capacitor)
        working-directory: ministries
        run: |
          cat > package.json << 'EOF'
          {
            "name": "sam-idengeli-ministries-ios",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/cli": "^8.4.2",
              "@capacitor/core": "^8.4.2",
              "@capacitor/ios": "^8.4.2"
            }
          }
          EOF
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.samidengeli.ministries",
            "appName": "Sam Idengeli Ministries",
            "webDir": "www",
            "server": {
              "url": "https://samidengeli.com",
              "cleartext": false,
              "allowNavigation": ["samidengeli.com", "*.samidengeli.com"]
            },
            "ios": { "contentInset": "always" }
          }
          EOF
          mkdir -p www && echo '<!doctype html><title>Sam Idengeli Ministries</title>' > www/index.html
          npm install
          npx cap add ios
          npx cap sync ios

      - name: App icon, audio background mode, export compliance
        working-directory: ministries
        run: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset
          ls $ICON
          cp icon-1024.png "$ICON/AppIcon-512@2x.png"
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $PL || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PL || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Sam\ Idengeli\ Ministries" $PL || true

      - name: Write App Store Connect API key
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPSTORE_API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      - name: Build and archive (unsigned; Apple signs it at export)
        working-directory: ministries/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Ministries.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            clean archive

      - name: Export IPA
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Ministries.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8 \
            -authenticationKeyID ${APPSTORE_API_KEY_ID} \
            -authenticationKeyIssuerID ${APPSTORE_ISSUER_ID}

      - name: Upload to App Store Connect
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/App.ipa \
            -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
